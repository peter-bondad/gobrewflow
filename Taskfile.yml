version: "3"

dotenv:
  - .env

env:
  MIGRATE_VERSION: "v4.18.2"

vars:
  DATABASE_URL: postgres://{{.DB_USER}}:{{.DB_PASSWORD}}@{{.DB_HOST}}:{{.DB_PORT}}/{{.DB_NAME}}?sslmode={{.DB_SSL_MODE}}

tasks:
  setup:
    desc: Install development tools
    cmds:
      - echo "Installing development tools..."
      - go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@{{.MIGRATE_VERSION}}
      - go install github.com/air-verse/air@latest

  dev:
    desc: Start the application with Air
    cmds:
      - air

  migrate-up:
    desc: Run all pending migrations
    cmds:
      - migrate -path ./db/migrations -database "{{.DATABASE_URL}}" up

  migrate-down:
    desc: Rollback the last migration
    cmds:
      - migrate -path ./db/migrations -database "{{.DATABASE_URL}}" down 1

  migrate-create:
    desc: "Create a new migration file (usage: task migrate-create NAME=create_orders_table)"
    cmds:
      - migrate create -seq -ext sql -dir ./db/migrations {{.NAME}}

  migrate-force:
    desc: "Force migration version (usage: task migrate-force VERSION=1)"
    cmds:
      - migrate -path ./db/migrations -database "{{.DATABASE_URL}}" force {{.VERSION}}

  docker-up:
    desc: Start Docker Compose services
    cmds:
      - docker compose up -d

  docker-down:
    desc: Stop Docker Compose services and remove volumes
    cmds:
      - docker compose down -v
